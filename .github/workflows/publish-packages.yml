name: Publish Packages

on:
  release:
    types: [published]

permissions: {}

jobs:
  # ─── npm (npmjs.com) ───
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm run test:full
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ─── GitHub Packages (npm) ───
  publish-gpr:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@codinglombok'
      - run: npm ci
      - run: npm run build
      - run: npm run test:full
      - name: Scope package for GitHub Packages
        run: |
          node -e "
            const pkg = require('./package.json');
            pkg.name = '@codinglombok/lombokecc';
            pkg.publishConfig = { registry: 'https://npm.pkg.github.com' };
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── PyPI (Python) ───
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: pip install build twine
      - name: Run vector tests
        run: |
          cd ports/python
          python tests/check_vectors.py ../vectors/lombok-ecc-vectors-v1.json
      - name: Build package
        run: python -m build
      - name: Publish to PyPI
        run: python -m twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  # ─── Packagist (PHP) ───
  # Packagist auto-updates via webhook — no publish step needed.
  # Setup: packagist.org → Settings → Add your GitHub repo URL.
  # Every push/release triggers the webhook and Packagist re-reads composer.json.
  verify-php:
    name: Verify PHP port
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Run vector tests
        run: php ports/php/tests/check-vectors.php ports/vectors/lombok-ecc-vectors-v1.json

  # ─── crates.io (Rust) ───
  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run vector tests
        run: |
          cd ports/rust
          cargo run --bin check-vectors -- ../vectors/lombok-ecc-vectors-v1.txt
      - name: Publish
        run: |
          cd ports/rust
          cargo publish --token ${{ secrets.CRATES_TOKEN }}

  # ─── Go ───
  # Go modules are fetched directly from the git repo via proxy.golang.org.
  # No publish step — the tag + push is enough. This job just verifies.
  verify-go:
    name: Verify Go port
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Run vector tests
        run: |
          cd ports/go
          go run cmd/check-vectors/main.go ../vectors/lombok-ecc-vectors-v1.json

  # ─── C++ ───
  # Header-only, no registry. This job just verifies it compiles.
  verify-cpp:
    name: Verify C++ port
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          cd ports/cpp
          mkdir build && cd build
          cmake ..
          make
          ./check_vectors ../../vectors/lombok-ecc-vectors-v1.txt
